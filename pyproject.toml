[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-upload"
version = "0.1.0"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
]

[project.scripts]
sau = "sau_cli:main"
autoself = "desktop_cloud:main"
sau-desktop = "desktop_cloud:main"
sau-desktop-local = "desktop_main:main"

[project.optional-dependencies]
web = [
  "Flask[async]==3.1.1",
  "flask-cors==6.0.0",
  "yt-dlp>=2025.1.0",
  "PyMySQL>=1.1.1",
]
desktop = [
  "Flask[async]==3.1.1",
  "flask-cors==6.0.0",
  "yt-dlp>=2025.1.0",
  "pywebview>=5.3.2",
  "PyMySQL>=1.1.1",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["cli_main", "conf", "sau_cli", "desktop_main", "desktop_cloud"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "myUtils*", "downloader*", "web_mvp*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]

# /etc/nginx/sites-available/autoself  (synced by deploy)
# Dual gunicorn backends with aggressive failover — never mark both "down"
# for brief reload blips (that caused ERR_EMPTY_RESPONSE / ERR_CONNECTION_CLOSED).

upstream autoself_backend {
    least_conn;
    # max_fails=0: never mark a peer permanently unavailable
    server 127.0.0.1:5410 max_fails=0;
    server 127.0.0.1:5411 max_fails=0;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name autopost.com.cn www.autopost.com.cn 82.156.164.185 _;

    client_max_body_size 512m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://autoself_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # required with upstream keepalive
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # fail fast to the other peer on restart blips
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autopost.com.cn www.autopost.com.cn;

    client_max_body_size 512m;

    ssl_certificate /etc/letsencrypt/live/autopost.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopost.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://autoself_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }
}

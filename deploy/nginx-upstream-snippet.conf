# Snippet for /etc/nginx/sites-enabled/autoself upstream block.
# Soften fail detection so brief gunicorn reload does not mark both backends down.
upstream autoself_backend {
    least_conn;
    server 127.0.0.1:5410 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5411 max_fails=3 fail_timeout=10s;
}
